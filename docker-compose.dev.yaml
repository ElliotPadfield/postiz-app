services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_DB: postiz-db-local
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-user -d postiz-db-local']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
