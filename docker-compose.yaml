services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.internal
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}/api
        NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ${PUBLIC_URL:?Set PUBLIC_URL in .env}/uploads
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postiz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/postiz
      RUN_WORKER: 'true'
      FRONTEND_URL: ${PUBLIC_URL}
      MAIN_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ${PUBLIC_URL}/uploads
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all([fetch('http://127.0.0.1:5000'),fetch('http://127.0.0.1:3000')]).then(rs=>process.exit(rs.every(r=>r.status<500)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postiz
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz -d postiz']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  uploads:
